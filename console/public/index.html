<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WebAI</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f1ea;
      --panel: #fffdf8;
      --ink: #1c1915;
      --muted: #6d655c;
      --line: #e4ddd2;
      --accent: #0f6e6b;
      --accent-ink: #f7fffe;
      --run: #1d4e89;
      --ok: #1f7a3a;
      --fail: #9d2430;
      --fail-bg: #fdecef;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
      font: 15px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    header, aside { background: var(--panel); }
    header { display: flex; gap: 16px; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
    header h1 { margin: 0; font-size: 18px; }
    header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
    .pill { margin-left: auto; padding: 4px 10px; border-radius: 999px; background: #ece7df; font-size: 13px; }
    .header-tools { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .header-tools .pill { margin-left: 0; }
    #render-mode { background: transparent; color: var(--ink); border: 1px solid var(--line); }
    #render-mode[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .bubble .plain { white-space: pre-wrap; word-break: break-word; }
    .pill.run { background: #e5f0fb; color: var(--run); }
    .pill.ok { background: #e5f6ea; color: var(--ok); }
    .pill.fail { background: var(--fail-bg); color: var(--fail); }
    main { display: grid; grid-template-columns: 300px 1fr; min-height: 0; }
    aside { padding: 16px; overflow: auto; border-right: 1px solid var(--line); }
    label { display: block; margin: 12px 0 6px; color: var(--muted); font-size: 13px; }
    label.with-hint { display: flex; align-items: center; gap: 6px; }
    .hint-icon {
      position: relative; display: inline-flex; align-items: center; justify-content: center;
      width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--line);
      color: var(--muted); font-size: 11px; line-height: 1; cursor: help;
    }
    .hint-icon::after {
      content: attr(data-tip); display: none; position: absolute; left: 0; top: calc(100% + 6px); z-index: 5;
      width: 220px; padding: 8px 10px; border-radius: 8px; background: var(--ink); color: #fffdf8;
      font-size: 12px; font-weight: 400; line-height: 1.45; white-space: normal;
    }
    .hint-icon:hover::after, .hint-icon:focus::after { display: block; }
    button, textarea { font: inherit; }
    button { border: 0; border-radius: 8px; padding: 8px 12px; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
    button.secondary, .sessions button { background: transparent; color: var(--ink); border: 1px solid transparent; }
    button:disabled { opacity: 0.55; cursor: wait; }
    .sessions { list-style: none; margin: 8px 0 0; padding: 0; }
    .sessions > li { margin: 0 0 8px; }
    .sessions .group-head {
      display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 4px; align-items: center;
      margin: 0 0 4px; padding: 2px 4px 2px 0; background: transparent; color: var(--ink);
      border: 1px solid var(--line); border-radius: 8px;
    }
    .sessions .group-head:hover, .sessions .group-head.open { background: #f7f3ec; }
    .sessions .group-head.busy { color: var(--run); background: #e5f0fb; border-color: #c5daf3; }
    .sessions .group-head.busy .group-toggle,
    .sessions .group-head.busy .count,
    .sessions .group-head.busy .path,
    .sessions .group-head.busy .mark,
    .sessions .group-head.busy .group-add { color: var(--run); }
    .sessions .group-head.busy:hover, .sessions .group-head.busy.open { background: #d4e7f8; border-color: #9ec3ea; }
    .sessions .group-head.busy .group-add:hover { background: #fff; border-color: #9ec3ea; }
    .sessions .group-toggle {
      display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px; align-items: center;
      width: 100%; margin: 0; padding: 4px 6px; text-align: left; background: transparent; color: var(--ink); border: 0;
    }
    .sessions .group-head .mark { color: var(--muted); font-family: Consolas, "Cascadia Mono", monospace; }
    .sessions .group-head .path { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
    .sessions .group-head .count { color: var(--muted); font-size: 12px; }
    .sessions .group-add {
      width: 24px; height: 24px; margin: 0; padding: 0; border-radius: 6px;
      background: transparent; color: var(--ink); border: 1px solid transparent; font-size: 16px; line-height: 1;
    }
    .sessions .group-add:hover { border-color: var(--line); background: #fff; }
    .sessions .group-body { list-style: none; margin: 0; padding: 0 0 0 8px; }
    .sessions .group-body[hidden] { display: none; }
    .sessions .chat-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 4px; align-items: center; margin: 0 0 4px; }
    .sessions .chat-row button.open {
      width: 100%; min-width: 0; margin: 0; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .sessions .chat-row input.rename-input {
      width: 100%; min-width: 0; font: inherit; color: var(--ink);
      border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: #fff;
    }
    .sessions .chat-row button.rename,
    .sessions .chat-row button.detach {
      width: 24px; height: 24px; margin: 0; padding: 0; border-radius: 6px;
      font-size: 12px; line-height: 1; color: var(--muted); border: 1px solid transparent;
    }
    .sessions .chat-row button.rename:hover { color: var(--accent); border-color: var(--line); background: #f7f3ec; }
    .sessions .chat-row button.open.active, .sessions .chat-row button.open:hover { border-color: var(--line); background: #f7f3ec; }
    .sessions .chat-row button.open.busy { color: var(--run); background: #e5f0fb; border-color: #c5daf3; }
    .sessions .chat-row button.open.busy.active, .sessions .chat-row button.open.busy:hover { background: #d4e7f8; border-color: #9ec3ea; }
    .sessions .chat-row button.detach:hover { color: var(--fail); border-color: #f3c2c8; background: var(--fail-bg); }
    .tools { list-style: none; margin: 0; padding: 0; }
    .tools button, .steps button, .monitor-open { width: 100%; margin: 0 0 6px; text-align: left; background: transparent; color: var(--ink); border: 1px solid transparent; }
    .tools button:hover, .steps button:hover, .steps button.active, .monitor-open:hover { border-color: var(--line); background: #f7f3ec; }
    .monitor { position: fixed; inset: 58px 0 0 300px; z-index: 3; display: grid; grid-template-rows: auto 1fr; background: var(--panel); border-left: 1px solid var(--line); }
    .monitor[hidden] { display: none; }
    .monitor-bar { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
    .monitor-bar .note { flex: 1; }
    .monitor-body { display: grid; grid-template-columns: 340px 1fr; min-height: 0; }
    .step-pane { display: grid; grid-template-rows: auto 1fr; min-height: 0; border-right: 1px solid var(--line); }
    .filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
    .filters button { background: transparent; color: var(--ink); border: 1px solid var(--line); padding: 4px 8px; }
    .filters button.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .steps { list-style: none; margin: 0; padding: 12px 12px 12px 18px; overflow: auto; }
    .steps li { position: relative; margin: 0 0 8px; padding-left: 16px; }
    .steps li::before { content: ""; position: absolute; left: 0; top: 4px; bottom: -10px; width: 2px; background: var(--line); }
    .steps li::after { content: ""; position: absolute; left: -3px; top: 12px; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .steps li.edit::after { background: var(--accent); }
    .steps li.shell::after { background: var(--run); }
    .steps li.skill::after, .steps li.call::after { background: var(--ok); }
    .steps li.subagent::after { background: #7a4e9d; }
    .steps li.result::after, .steps li.error::after { background: var(--fail); }
    .activity { max-width: 760px; margin: 0 0 8px 12px; border-left: 2px solid var(--line); padding-left: 10px; }
    .activity button.line { width: 100%; text-align: left; background: transparent; color: var(--ink); border: 1px solid transparent; }
    .activity button.line:hover, .activity.open button.line { border-color: var(--line); background: #f7f3ec; }
    .activity.edit { border-color: var(--accent); }
    .activity.shell { border-color: var(--run); }
    .activity.skill, .activity.call { border-color: var(--ok); }
    .activity.subagent { border-color: #7a4e9d; }
    #raw { margin: 0; padding: 16px 18px; overflow: auto; background: var(--bg); color: var(--ink); }
    .visual-head { margin: 0 0 14px; font-size: 16px; }
    .step-section {
      margin: 0 0 14px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fffdf8;
    }
    .step-section > h3 {
      margin: 0 0 8px; font-size: 13px; color: var(--accent); font-weight: 700; letter-spacing: 0.02em;
    }
    .step-section .empty { margin: 0; color: var(--muted); font-size: 13px; }
    .field { margin: 0 0 12px; }
    .field:last-child { margin-bottom: 0; }
    .field h3, .diff h3 { margin: 8px 0 6px; font-size: 12px; color: var(--muted); font-weight: 600; }
    .field pre, .diff { margin: 0; white-space: pre-wrap; word-break: break-word; font: 13px/1.45 Consolas, "Cascadia Mono", monospace; }
    .diff-del, .diff-add { padding: 1px 8px; }
    .diff-del { background: var(--fail-bg); color: var(--fail); }
    .diff-add { background: #e5f6ea; color: var(--ok); }
    .activity .detail { display: none; margin: 6px 0 0; padding: 8px 10px; overflow: visible; background: var(--panel); border-radius: 8px; }
    .scroll-log { margin: 0; max-height: 70vh; overflow: auto; white-space: pre-wrap; word-break: break-word; font: 13px/1.45 Consolas, "Cascadia Mono", monospace; }
    #raw .scroll-log { max-height: none; overflow: visible; }
    .activity.open .detail { display: block; }
    .chat { display: grid; grid-template-rows: auto 1fr auto auto; min-height: 0; }
    .prompt {
      display: none;
      padding: 8px 0 6px;
      border-bottom: 1px solid var(--line);
      background: #e7f4f3;
    }
    .prompt.show { display: block; }
    .prompt .who { margin: 0 18px 2px; }
    .prompt .body-scroll {
      max-height: 4.5em;
      overflow: auto;
      padding: 0 18px;
      scrollbar-gutter: stable;
    }
    .prompt .body {
      max-width: 760px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .thread { overflow: auto; scrollbar-gutter: stable; padding: 18px; min-height: 0; }
    button.history-more {
      display: block; width: 100%; max-width: 760px; margin: 0 0 14px; padding: 8px 12px;
      background: transparent; color: var(--muted); border: 1px dashed var(--line); border-radius: 8px; text-align: center;
    }
    button.history-more:hover { color: var(--ink); border-color: var(--accent); background: #f7f3ec; }
    .turn-marker { height: 0; margin: 0; padding: 0; border: 0; overflow: hidden; }
    .bubble { max-width: 760px; margin: 0 0 12px; padding: 10px 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); white-space: pre-wrap; }
    .bubble.user { margin-left: auto; background: #d9ecea; border-color: #b7d8d5; }
    .bubble.answer { border-color: #9cc9c6; box-shadow: inset 3px 0 0 var(--accent); }
    .bubble.fail { background: var(--fail-bg); border-color: #f3c2c8; }
    .bubble.rich { max-width: min(920px, 100%); white-space: normal; }
    .bubble .md > :first-child { margin-top: 0; }
    .bubble .md > :last-child { margin-bottom: 0; }
    .bubble .md p, .bubble .md ul, .bubble .md ol, .bubble .md pre, .bubble .md blockquote, .bubble .md h1, .bubble .md h2, .bubble .md h3, .bubble .md h4, .bubble .md h5, .bubble .md h6 { margin: 0 0 8px; }
    .bubble .md h1, .bubble .md h2, .bubble .md h3, .bubble .md h4 { font-size: 16px; line-height: 1.3; }
    .bubble .md h1 { font-size: 20px; }
    .bubble .md ul, .bubble .md ol { padding-left: 1.2em; }
    .bubble .md blockquote { padding-left: 10px; border-left: 3px solid var(--line); color: var(--muted); }
    .bubble .md a { color: var(--accent); }
    .bubble .md .table-wrap { overflow: auto; margin: 0 0 8px; }
    .bubble .md table { border-collapse: collapse; width: 100%; }
    .bubble .md th, .bubble .md td { border: 1px solid var(--line); padding: 4px 8px; vertical-align: top; }
    .bubble .md th { background: #f7f3ec; }
    .bubble .md pre { overflow: auto; background: var(--bg); padding: 8px 10px; border-radius: 8px; }
    .bubble .md code { font-family: Consolas, "Cascadia Mono", monospace; font-size: 13px; }
    .bubble .md p code, .bubble .md li code, .bubble .md td code { background: var(--bg); padding: 0 4px; border-radius: 4px; }
    .bubble .md .lang { display: block; margin-bottom: 4px; color: var(--muted); font-size: 12px; }
    .bubble .mermaid { overflow: auto; margin: 0 0 8px; padding: 8px; border-radius: 8px; background: #fff; }
    .who { display: block; margin-bottom: 4px; color: var(--muted); font-size: 12px; }
    .note.turn-end, .note.turn-fail {
      max-width: 760px;
      margin: 4px 0 16px;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px dashed var(--line);
      background: #f7f3ec;
      font-weight: 600;
    }
    .note.turn-fail { border-color: #f3c2c8; background: var(--fail-bg); color: var(--fail); white-space: pre-wrap; word-break: break-word; font-weight: 500; }
    .choices { max-height: 42vh; overflow: auto; padding: 12px 18px; border-top: 1px solid var(--line); background: #e7f4f3; }
    .choices[hidden] { display: none; }
    .choices h2 { margin: 0; font-size: 15px; color: var(--accent); }
    .choices .meta, .choices .hint { color: var(--muted); font-size: 12px; }
    .choices .ask { margin: 8px 0; max-width: 760px; }
    .choices button.option, .choices .other {
      display: flex; gap: 8px; align-items: center; width: 100%; max-width: 760px;
      margin: 0 0 4px; text-align: left; background: transparent; color: var(--ink);
      border: 1px solid transparent; font-family: Consolas, "Cascadia Mono", monospace;
    }
    .choices .other button.option { width: auto; }
    .choices .other input { flex: 1; font: inherit; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
    .queue { list-style: none; margin: 0; padding: 8px 18px 0; max-height: 120px; overflow: auto; }
    .queue[hidden] { display: none; }
    .queue li { display: flex; gap: 8px; align-items: center; margin: 0 0 4px; }
    .queue span { flex: 1; overflow: hidden; color: var(--muted); font-size: 13px; white-space: nowrap; text-overflow: ellipsis; }
    .queue button { background: transparent; color: var(--ink); border: 1px solid var(--line); padding: 2px 8px; }
    .new-chat { display: grid; gap: 6px; margin: 0 0 12px; }
    .new-chat .path-row { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
    .new-chat input {
      width: 100%; min-width: 0; font: inherit; color: var(--ink);
      border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: #fff;
    }
    .new-chat button { background: transparent; color: var(--ink); border: 1px solid var(--line); padding: 6px 8px; }
    .new-chat button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .new-chat button:disabled { opacity: 0.6; }
    .new-chat .hint { margin: 0; }
    .create-choice {
      display: grid; gap: 6px; padding: 8px; border: 1px dashed var(--line); border-radius: 8px; background: #f7f3ec;
    }
    .create-choice[hidden] { display: none; }
    .create-choice .actions-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .create-choice .meta { margin: 0; color: var(--muted); font-size: 12px; }
    .composer { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 12px 18px 18px; }
    .model-row { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .model-row label { margin: 0; }
    .model-row select {
      width: auto; max-width: 220px; min-width: 0; font: inherit; color: var(--ink); background: #fff;
      border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px;
    }
    .model-row input[type="text"] {
      width: 200px; max-width: 100%; min-width: 0; font: inherit; color: var(--ink); background: #fff;
      border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px;
    }
    .model-row button.ghost {
      background: transparent; color: var(--ink); border: 1px solid var(--line); padding: 6px 10px;
    }
    .model-row .proxy-box { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .model-row .proxy-box[hidden] { display: none; }
    .model-row .proxy-note { font-size: 12px; color: var(--muted); }
    .model-row .zoom-box { display: inline-flex; gap: 4px; align-items: center; margin-left: auto; }
    .model-row .zoom-box button { min-width: 40px; padding: 6px 8px; }
    .thread > *, #prompt > * { zoom: var(--thread-zoom, 1); }
    .actions { display: flex; flex-direction: column; gap: 8px; }
    #send, #cancel { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 76px; line-height: 1.2; }
    #send small, #cancel small { font-size: 11px; opacity: 0.85; }
    #cancel { background: var(--fail); }
    #cancel[hidden] { display: none; }
    textarea { width: 100%; min-height: 72px; resize: vertical; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
    .note { color: var(--muted); font-size: 13px; }
  </style>
</head>
<body class="notranslate" translate="no">
  <header>
    <div>
      <h1>WebAI</h1>
      <p id="meta">等待附着到 Cursor CLI 会话</p>
      <p id="usage" class="note">本会话还没有 token 记录</p>
    </div>
    <div class="header-tools">
      <button type="button" id="render-mode" aria-pressed="true">图形化</button>
      <span id="status" class="pill">空闲</span>
    </div>
  </header>
  <main>
    <aside>
      <label>监控</label>
      <button type="button" id="open-monitor" class="monitor-open">打开监控</button>
      <p id="tool" class="note">当前没有工具调用</p>
      <ul id="tools" class="tools"></ul>
      <p id="sync" class="note"></p>
      <label>新开会话</label>
      <div class="new-chat">
        <div class="path-row">
          <input id="new-cwd" type="text" placeholder="工作目录，例如 D:\AI_Proj\hello_world" autocomplete="off" spellcheck="false">
          <button type="button" id="pick-cwd">浏览</button>
        </div>
        <button type="button" id="create-chat" class="primary">开启 Agent</button>
        <div id="create-choice" class="create-choice" hidden>
          <p id="create-choice-text" class="meta"></p>
          <div class="actions-row">
            <button type="button" id="reuse-chat" class="primary">使用旧的</button>
            <button type="button" id="force-new-chat">新建</button>
          </div>
        </div>
        <p id="create-note" class="note hint"></p>
      </div>
      <label class="with-hint">附着过的会话<span class="hint-icon" tabindex="0" data-tip="同目录会折叠。移除只是离开网页列表，Cursor 对话还在，以后还能再附着。">?</span></label>
      <ul id="sessions" class="sessions"></ul>
    </aside>
    <section class="chat">
      <div id="prompt" class="prompt" aria-live="polite">
        <span class="who">你</span>
        <div class="body-scroll">
          <div id="prompt-text" class="body"></div>
        </div>
      </div>
      <div id="thread" class="thread"></div>
      <div id="choices" class="choices" hidden tabindex="0"></div>
      <ul id="queue" class="queue" hidden></ul>
      <form id="composer" class="composer">
        <div class="model-row">
          <label for="model">模型</label>
          <select id="model">
            <option value="">默认</option>
          </select>
          <label for="mode">模式</label>
          <select id="mode" title="默认：不指定模式">
            <option value="">默认</option>
            <option value="agent">Agent</option>
            <option value="plan">Plan</option>
            <option value="ask">Ask</option>
          </select>
          <button type="button" id="toggle-proxy" class="ghost" title="设置 Cursor CLI 访问外网的 HTTP 代理">代理：直连</button>
          <span id="proxy-box" class="proxy-box" hidden>
            <input id="proxy-url" type="text" placeholder="http://127.0.0.1:9910（留空为直连）" autocomplete="off" spellcheck="false">
            <button type="button" id="save-proxy" class="ghost">保存</button>
            <span id="proxy-note" class="proxy-note"></span>
          </span>
          <span class="zoom-box" role="group" aria-label="对话框字体大小">
            <button type="button" id="zoom-out" class="ghost" title="对话框字体缩小">A-</button>
            <button type="button" id="zoom-reset" class="ghost" title="恢复默认字体大小">100%</button>
            <button type="button" id="zoom-in" class="ghost" title="对话框字体放大">A+</button>
          </span>
        </div>
        <textarea id="message" placeholder="发给当前这条 CLI 会话，Alt+S 发送。这条会话正忙时会进入队列。光标在首行或末行时，用上下键翻历史"></textarea>
        <div class="actions">
          <button id="send" type="submit">发送<small>Alt+S</small></button>
          <button id="cancel" type="button" hidden>终止<small>Esc</small></button>
        </div>
      </form>
    </section>
  </main>
  <section id="monitor" class="monitor" hidden>
    <div class="monitor-bar">
      <strong>监控</strong>
      <span class="note">最近步骤按时间排开。点一步查看文件、命令和改动。</span>
      <button type="button" id="close-monitor" class="secondary">关闭</button>
    </div>
    <div class="monitor-body">
      <div class="step-pane">
        <div id="filters" class="filters"></div>
        <ul id="steps" class="steps"></ul>
      </div>
      <div id="raw">点左侧一步，查看这一步做了什么。</div>
    </div>
  </section>
  <script src="/render-md.js"></script>
  <script src="/mermaid.min.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const diagramSvg = new Map();
    if (window.mermaid) {
      mermaid.initialize({
        startOnLoad: false,
        securityLevel: "strict",
        theme: "neutral",
        fontFamily: '"Segoe UI", "Microsoft YaHei", sans-serif',
      });
    }
    const state = {
      chatId: params.get("chat") || "",
      cwd: "",
      modelId: "",
      mode: "",
      proxy: "",
      promptRestoreKey: "",
      running: false,
      steps: [],
      selectedStep: 0,
      filter: "all",
      pendingQuestion: "",
      inputHistory: [],
      historyCursor: -1,
      historyDraft: "",
      choice: null,
      choiceQuestion: 0,
      choiceOption: 0,
      choiceSelected: {},
      choiceFreeform: {},
      dismissedChoiceId: "",
      queues: {},
      handed: {},
      remoteRunning: false,
      idleWhileLocal: 0,
      turnToken: 0,
      stickToBottom: true,
      historyTurns: 30,
      anchorHistory: false,
      historyLoading: false,
      groupOpen: {},
    };
    let pinningThread = false;
    const OTHER = "__other__";

    const meta = document.querySelector("#meta");
    const usage = document.querySelector("#usage");
    const statusPill = document.querySelector("#status");
    const toolLine = document.querySelector("#tool");
    const tools = document.querySelector("#tools");
    const monitor = document.querySelector("#monitor");
    const stepList = document.querySelector("#steps");
    const filters = document.querySelector("#filters");
    const rawView = document.querySelector("#raw");
    const syncLine = document.querySelector("#sync");
    const sessions = document.querySelector("#sessions");
    const promptBox = document.querySelector("#prompt");
    const promptText = document.querySelector("#prompt-text");
    const thread = document.querySelector("#thread");

    function setPrompt(text) {
      const value = String(text || "").trim();
      promptText.textContent = value;
      promptBox.classList.toggle("show", Boolean(value));
    }

    function addTurnMarker(question) {
      const marker = document.createElement("div");
      marker.className = "turn-marker";
      marker.dataset.question = String(question || "");
      thread.append(marker);
      return marker;
    }

    function threadNearBottom() {
      return thread.scrollHeight - thread.scrollTop - thread.clientHeight <= 80;
    }

    function followThreadBottom() {
      if (!state.stickToBottom) return;
      pinningThread = true;
      thread.scrollTop = thread.scrollHeight;
      pinningThread = false;
    }

    function syncPromptFromScroll() {
      const markers = [...thread.querySelectorAll(".turn-marker")];
      if (!markers.length) return;
      const distanceFromBottom = thread.scrollHeight - thread.scrollTop - thread.clientHeight;
      if (distanceFromBottom <= 32) {
        setPrompt(markers[markers.length - 1].dataset.question || "");
        return;
      }
      const line = thread.scrollTop + 12;
      let current = markers[0];
      for (const marker of markers) {
        if (marker.offsetTop <= line) current = marker;
        else break;
      }
      setPrompt(current.dataset.question || "");
    }

    function setStatus(text, kind) {
      statusPill.textContent = text;
      statusPill.className = "pill" + (kind ? " " + kind : "");
      const cancel = document.querySelector("#cancel");
      if (cancel) cancel.hidden = !(state.running || state.remoteRunning);
    }

    function formatCount(value) {
      return (Number(value) || 0).toLocaleString("zh-CN");
    }

    function failNote(stopped, message) {
      if (stopped) return "已终止";
      const reason = String(message || "").trim();
      if (!reason || reason === "本轮失败") return "本轮失败";
      return "本轮失败：" + reason;
    }

    function formatDuration(ms) {
      if (ms == null || ms === "") return "无逐步耗时";
      const value = Number(ms);
      if (!Number.isFinite(value)) return "无逐步耗时";
      if (value < 1000) return Math.round(value) + " 毫秒";
      const seconds = value / 1000;
      return (seconds < 10 ? seconds.toFixed(1) : Math.round(seconds).toLocaleString("zh-CN")) + " 秒";
    }

    const fieldLabels = {
      path: "文件",
      file_path: "文件",
      target_directory: "目录",
      command: "命令",
      description: "说明",
      pattern: "条件",
      glob_pattern: "匹配",
      old_string: "原来的内容",
      new_string: "改成",
      contents: "写入内容",
      namespace: "来源",
      toolName: "名称",
      arguments: "参数",
      prompt: "任务",
      subagent_type: "类型",
      limit: "范围",
      offset: "起始行",
      head_limit: "最多几条",
      working_directory: "工作目录",
      workingDirectory: "工作目录",
      exitCode: "退出码",
      stdout: "标准输出",
      stderr: "标准错误",
      interleavedOutput: "输出",
      signal: "信号",
      executionTime: "耗时毫秒",
      localExecutionTimeMs: "本机耗时毫秒",
      timeout: "超时毫秒",
      isBackground: "后台",
    };

    function stepPayload(step) {
      if (!step || !step.raw) return null;
      try {
        return JSON.parse(step.raw);
      } catch {
        return null;
      }
    }

    function addField(container, label, value) {
      if (value == null || value === "") return;
      const block = document.createElement("section");
      block.className = "field";
      const title = document.createElement("h3");
      title.textContent = label;
      block.append(title);
      if (typeof value === "object") {
        const keys = Object.keys(value);
        if (!keys.length) return;
        for (const key of keys) addField(block, fieldLabels[key] || key, value[key]);
      } else {
        const body = document.createElement("pre");
        body.textContent = String(value);
        block.append(body);
      }
      container.append(block);
    }

    function addDiff(container, before, after) {
      if (!before && !after) return;
      const wrap = document.createElement("div");
      wrap.className = "diff";
      if (before) {
        const title = document.createElement("h3");
        title.textContent = "删去";
        wrap.append(title);
        for (const line of String(before).split("\n")) {
          const row = document.createElement("div");
          row.className = "diff-del";
          row.textContent = "- " + line;
          wrap.append(row);
        }
      }
      if (after) {
        const title = document.createElement("h3");
        title.textContent = "写成";
        wrap.append(title);
        for (const line of String(after).split("\n")) {
          const row = document.createElement("div");
          row.className = "diff-add";
          row.textContent = "+ " + line;
          wrap.append(row);
        }
      }
      container.append(wrap);
    }

    const scrollCache = new Map();
    const scrollLoads = new Map();

    function showRaw(step) {
      const top = rawView.scrollTop;
      rawView.replaceChildren();
      if (!step) {
        rawView.textContent = "点左侧一步，查看这一步做了什么。";
        return;
      }
      renderStepView(rawView, step);
      rawView.scrollTop = top;
    }

    function loadScroll(head, log) {
      if (scrollCache.has(head)) {
        log.textContent = scrollCache.get(head);
        return;
      }
      let pending = scrollLoads.get(head);
      if (!pending) {
        pending = fetch("/api/session/" + encodeURIComponent(state.chatId) + "/scroll?head=" + encodeURIComponent(head))
          .then((response) => response.ok ? response.json() : null)
          .then((data) => {
            const text = data && data.text ? data.text : "";
            if (text) scrollCache.set(head, text);
            scrollLoads.delete(head);
            return text;
          })
          .catch(() => {
            scrollLoads.delete(head);
            return "";
          });
        scrollLoads.set(head, pending);
      }
      pending.then((text) => {
        if (!log.isConnected || log.dataset.head !== head) return;
        if (text) log.textContent = text;
        else if (!log.textContent) log.textContent = "没有找到这个子代理的滚屏记录。";
      });
    }

    function resultBody(result) {
      if (!result || typeof result !== "object") return null;
      return result.success || result.failure || result.error || result;
    }

    function addSection(container, title) {
      const section = document.createElement("section");
      section.className = "step-section";
      const head = document.createElement("h3");
      head.textContent = title;
      section.append(head);
      container.append(section);
      return section;
    }

    function sectionHasContent(section) {
      return [...section.children].some((node) => node.tagName !== "H3");
    }

    function markEmpty(section, text) {
      if (sectionHasContent(section)) return;
      const empty = document.createElement("p");
      empty.className = "empty";
      empty.textContent = text;
      section.append(empty);
    }

    function addInputFields(section, input, skip) {
      if (!input || typeof input !== "object") return;
      const ignored = skip || new Set();
      for (const key of Object.keys(input)) {
        if (ignored.has(key) || key === "name") continue;
        addField(section, fieldLabels[key] || key, input[key]);
      }
    }

    function addResultFields(section, result, preferred) {
      if (!result || typeof result !== "object") return;
      const used = new Set();
      for (const item of preferred || []) {
        if (result[item.key] == null || result[item.key] === "") continue;
        addField(section, item.label, result[item.key]);
        used.add(item.key);
      }
      for (const key of Object.keys(result)) {
        if (used.has(key)) continue;
        if (["isBackground"].includes(key)) continue;
        addField(section, fieldLabels[key] || key, result[key]);
      }
    }

    function fillLaunch(section, step, input) {
      if (step.kind === "edit" && input) {
        addField(section, "动作", step.name || "修改");
        addField(section, "文件", input.path || input.file_path);
        addInputFields(section, input, new Set(["old_string", "new_string", "contents", "path", "file_path", "name"]));
        return;
      }
      if (step.kind === "shell" && input) {
        addField(section, "说明", input.description || step.title);
        addField(section, "命令", input.command);
        addField(section, "工作目录", input.working_directory || input.workingDirectory || step.stat);
        addInputFields(section, input, new Set(["description", "command", "working_directory", "workingDirectory", "name"]));
        return;
      }
      if (step.kind === "read" && input) {
        addField(section, "文件", input.path || input.file_path || step.title);
        addInputFields(section, input, new Set(["path", "file_path", "name"]));
        return;
      }
      if (step.kind === "search" && input) {
        addField(section, "条件", input.pattern || input.glob_pattern || step.title);
        addField(section, "范围", input.path || input.file_path || input.target_directory || step.stat);
        addInputFields(section, input, new Set(["pattern", "glob_pattern", "path", "file_path", "target_directory", "name"]));
        return;
      }
      if ((step.kind === "subagent" || step.promptHead) && input) {
        addField(section, "任务", input.description || step.title);
        addField(section, "类型", input.subagent_type || step.stat);
        addField(section, "提示", input.prompt || input.task);
        addInputFields(section, input, new Set(["description", "subagent_type", "prompt", "task", "name"]));
        return;
      }
      if ((step.kind === "skill" || step.kind === "call") && input) {
        addField(section, "来源", input.namespace);
        addField(section, "名称", input.toolName || step.title);
        addField(section, "参数", input.arguments || input);
        return;
      }
      if (input) {
        addInputFields(section, input);
        return;
      }
      if (step.title) addField(section, "目标", step.title);
      if (step.detail && step.kind !== "edit" && step.kind !== "shell") addField(section, "内容", step.detail);
    }

    function fillProcess(section, step, input) {
      if (step.status === "running") addField(section, "状态", "正在执行…");
      if (step.durationMs != null) addField(section, "耗时", formatDuration(step.durationMs));
      if (step.kind === "edit" && input) {
        const before = input.old_string || "";
        const after = input.new_string || input.contents || "";
        if (before || after) addDiff(section, before, after);
        else if (step.detail) addField(section, "改动摘要", step.detail);
        return;
      }
      if (step.kind === "shell") {
        if (input && input.isBackground) addField(section, "执行方式", "后台运行");
        if (input && input.timeout != null) addField(section, "超时毫秒", input.timeout);
        return;
      }
      if (step.kind === "subagent" || step.promptHead) {
        const log = document.createElement("pre");
        log.className = "scroll-log";
        const cached = step.promptHead ? scrollCache.get(step.promptHead) || "" : "";
        log.textContent = cached || step.scroll || step.detail || (step.promptHead ? "正在读取子代理滚屏…" : "");
        if (step.promptHead) {
          log.dataset.head = step.promptHead;
          if (state.chatId && !cached) loadScroll(step.promptHead, log);
        }
        if (log.textContent) section.append(log);
        return;
      }
      if (step.kind === "thinking" && (step.scroll || step.detail || step.raw)) {
        addField(section, "思考过程", step.scroll || step.detail || step.raw);
      }
    }

    function fillOutcome(section, step, result) {
      const flag = step.status === "running" ? "进行中" : step.status === "error" ? "失败" : "完成";
      addField(section, "状态", flag);
      if (step.stat) addField(section, "摘要", step.stat);
      if (step.kind === "shell") {
        const preferred = [
          { key: "exitCode", label: "退出码" },
          { key: "stdout", label: "标准输出" },
          { key: "stderr", label: "标准错误" },
          { key: "signal", label: "信号" },
          { key: "executionTime", label: "耗时毫秒" },
          { key: "localExecutionTimeMs", label: "本机耗时毫秒" },
        ];
        if (!String((result && result.stdout) || "").trim() && !String((result && result.stderr) || "").trim()) {
          preferred.push({ key: "interleavedOutput", label: "输出" });
          preferred.push({ key: "output", label: "输出" });
        }
        if (result) {
          const slim = { ...result };
          if (String(slim.stdout || "").trim() || String(slim.stderr || "").trim()) {
            delete slim.interleavedOutput;
            delete slim.output;
          }
          addResultFields(section, slim, preferred);
        }
        return;
      }
      if (step.kind === "edit") {
        if (result) addResultFields(section, result);
        else if (step.status !== "running") addField(section, "结果", step.status === "error" ? "修改失败" : "文件已按上面的改动更新");
        return;
      }
      if (step.kind === "read") {
        addResultFields(section, result, [
          { key: "content", label: "文件内容" },
          { key: "contents", label: "文件内容" },
          { key: "text", label: "文件内容" },
        ]);
        return;
      }
      if (step.kind === "search") {
        addResultFields(section, result, [
          { key: "matches", label: "匹配结果" },
          { key: "files", label: "文件列表" },
          { key: "output", label: "输出" },
          { key: "content", label: "结果" },
        ]);
        return;
      }
      if (step.kind === "result") {
        if (result) addResultFields(section, result);
        else if (step.raw && step.raw.startsWith("{")) {
          const parsed = stepPayload(step);
          if (parsed) addResultFields(section, parsed);
        }
        return;
      }
      if (result) addResultFields(section, result);
      else if (step.scroll && step.kind !== "subagent" && !step.promptHead) addField(section, "输出", step.scroll);
    }

    function renderStepView(container, step) {
      container.replaceChildren();
      const head = document.createElement("h2");
      head.className = "visual-head";
      const flag = step.status === "running" ? "进行中" : step.status === "error" ? "失败" : "完成";
      head.textContent = [step.label || step.name || "步骤", step.title || "", step.stat || "", flag, formatDuration(step.durationMs)].filter(Boolean).join("  ·  ");
      container.append(head);
      const parsed = stepPayload(step);
      const input = parsed && parsed.input && typeof parsed.input === "object" ? parsed.input : null;
      const result = parsed && parsed.result ? resultBody(parsed.result) : null;
      const launch = addSection(container, "发起");
      const process = addSection(container, "经过");
      const outcome = addSection(container, "结果");
      fillLaunch(launch, step, input);
      fillProcess(process, step, input);
      fillOutcome(outcome, step, result);
      markEmpty(launch, "没有记录到发起内容。");
      markEmpty(process, step.status === "running" ? "还在执行，过程会陆续出现。" : "没有额外过程记录。");
      markEmpty(outcome, step.status === "running" ? "还没有结果。" : "没有记录到结果。");
    }

    const stepFilters = [
      ["all", "全部"],
      ["edit", "修改"],
      ["shell", "命令"],
      ["read", "读取"],
      ["search", "搜索"],
      ["skill", "技能"],
      ["call", "调用"],
      ["subagent", "子代理"],
    ];

    function renderFilters() {
      const counts = {};
      for (const step of state.steps || []) counts[step.kind] = (counts[step.kind] || 0) + 1;
      filters.replaceChildren();
      for (const [id, label] of stepFilters) {
        const count = id === "all" ? (state.steps || []).length : (counts[id] || 0);
        if (id !== "all" && id !== "edit" && !count) continue;
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = count ? label + " " + count : label;
        if ((state.filter || "all") === id) button.className = "active";
        button.addEventListener("click", () => {
          state.filter = id;
          const matches = (state.steps || []).map((step, index) => ({ step, index })).filter((item) => id === "all" || item.step.kind === id);
          if (matches.length && !matches.some((item) => item.index === state.selectedStep)) {
            state.selectedStep = matches[matches.length - 1].index;
          }
          renderSteps();
        });
        filters.append(button);
      }
    }

    function renderSteps() {
      renderFilters();
      stepList.replaceChildren();
      const list = state.steps || [];
      const visible = list.map((step, index) => ({ step, index })).filter((item) => !state.filter || state.filter === "all" || item.step.kind === state.filter);
      if (!list.length || !visible.length) {
        const empty = document.createElement("li");
        empty.className = "note";
        empty.textContent = list.length ? "没有这种步骤" : "还没有步骤";
        stepList.append(empty);
        rawView.replaceChildren();
        rawView.textContent = list.length ? "换一个类型，或查看全部步骤。" : "点左侧一步，查看这一步做了什么。";
        return;
      }
      if (!visible.some((item) => item.index === state.selectedStep)) state.selectedStep = visible[visible.length - 1].index;
      visible.forEach(({ step, index }) => {
        const item = document.createElement("li");
        const button = document.createElement("button");
        button.type = "button";
        if (index === state.selectedStep) button.className = "active";
        const flag = step.status === "running" ? "进行中" : step.status === "error" ? "失败" : "完成";
        button.textContent = [step.label || step.name, step.title || "", step.stat || "", flag, formatDuration(step.durationMs)].filter(Boolean).join("  ·  ");
        item.className = step.kind || "";
        button.addEventListener("click", () => {
          state.selectedStep = index;
          renderSteps();
        });
        item.append(button);
        stepList.append(item);
      });
      showRaw(list[state.selectedStep]);
    }

    function openMonitor(index) {
      if (typeof index === "number") {
        state.selectedStep = index;
        const step = (state.steps || [])[index];
        if (step && state.filter !== "all" && step.kind !== state.filter) state.filter = "all";
      }
      monitor.hidden = false;
      renderSteps();
    }

    function rememberStep(step) {
      if (!step) return;
      const list = state.steps || [];
      const at = list.findIndex((item) => item.id === step.id);
      if (at >= 0) list[at] = step;
      else list.push(step);
      state.steps = list.slice(-40);
      renderToolButtons();
      if (!monitor.hidden) renderSteps();
    }

    function renderToolButtons() {
      tools.replaceChildren();
      const list = state.steps || [];
      const recent = list.slice(-6);
      if (!recent.length) return;
      recent.forEach((step) => {
        const item = document.createElement("li");
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = (step.label || step.name) + " · " + (step.title || formatDuration(step.durationMs));
        button.addEventListener("click", () => openMonitor(list.indexOf(step)));
        item.append(button);
        tools.append(item);
      });
    }

    function renderUsage(total) {
      if (!total || !total.turns) {
        usage.textContent = "本会话还没有 token 记录";
        return;
      }
      const sum = (Number(total.inputTokens) || 0) + (Number(total.outputTokens) || 0);
      const parts = [
        total.turns + " 轮",
        "输入 " + formatCount(total.inputTokens),
        "输出 " + formatCount(total.outputTokens),
      ];
      if (total.cacheReadTokens) parts.push("缓存读取 " + formatCount(total.cacheReadTokens));
      if (total.cacheWriteTokens) parts.push("缓存写入 " + formatCount(total.cacheWriteTokens));
      parts.push("合计 " + formatCount(sum));
      usage.textContent = "本会话：" + parts.join(" · ");
    }

    function lastAnswerBubble() {
      const kids = [...thread.children];
      let afterTool = -1;
      kids.forEach((node, index) => {
        if (node.classList && node.classList.contains("activity")) afterTool = index;
      });
      for (let index = kids.length - 1; index > afterTool; index -= 1) {
        const node = kids[index];
        if (!node.classList || !node.classList.contains("bubble")) continue;
        if (node.querySelector(".who")?.textContent !== "Cursor") continue;
        return node;
      }
      return null;
    }

    const renderModeButton = document.querySelector("#render-mode");
    let richView = localStorage.getItem("webai-render") !== "plain";

    function syncRenderModeButton() {
      renderModeButton.textContent = richView ? "图形化" : "纯文本";
      renderModeButton.setAttribute("aria-pressed", richView ? "true" : "false");
      renderModeButton.title = richView ? "当前是图形化阅读，点击改为纯文本" : "当前是纯文本，点击改为图形化阅读";
    }

    function paintMessage(body) {
      const text = body.dataset.raw || "";
      const bubble = body.closest(".bubble");
      body.classList.add("reply");
      if (!richView) {
        body.classList.remove("md");
        body.classList.add("plain");
        if (bubble) bubble.classList.remove("rich");
        delete body.dataset.html;
        body.textContent = text;
        return;
      }
      body.classList.remove("plain");
      body.classList.add("md");
      if (bubble) bubble.classList.add("rich");
      const html = renderMarkdown(text);
      if (body.dataset.html === html) return;
      body.dataset.html = html;
      body.innerHTML = html;
      drawDiagrams(body);
    }

    function setRichView(next) {
      richView = next;
      localStorage.setItem("webai-render", next ? "rich" : "plain");
      syncRenderModeButton();
      for (const body of thread.querySelectorAll(".reply")) paintMessage(body);
    }

    renderModeButton.addEventListener("click", () => setRichView(!richView));
    syncRenderModeButton();

    async function drawDiagrams(root) {
      if (!window.mermaid) return;
      const nodes = [...root.querySelectorAll(".mermaid")];
      for (const node of nodes) {
        const code = node.textContent.trim();
        if (!code) continue;
        if (diagramSvg.has(code)) {
          if (node.dataset.drawn === code) continue;
          node.innerHTML = diagramSvg.get(code);
          node.dataset.drawn = code;
          continue;
        }
        if (node.dataset.pending === code) continue;
        node.dataset.pending = code;
        try {
          const id = "mmd" + Math.random().toString(36).slice(2);
          const rendered = await mermaid.render(id, code);
          diagramSvg.set(code, rendered.svg);
          if (!node.isConnected || node.dataset.pending !== code) continue;
          node.innerHTML = rendered.svg;
          node.dataset.drawn = code;
        } catch (error) {
          if (!node.isConnected || node.dataset.pending !== code) continue;
          const pre = document.createElement("pre");
          const source = document.createElement("code");
          source.textContent = code;
          pre.append(source);
          const note = document.createElement("p");
          note.className = "note";
          note.textContent = "图形没有画出来：" + (error && error.message ? error.message : error);
          node.replaceChildren(pre, note);
          node.dataset.drawn = code;
        }
      }
    }

    function absorbAssistant(text, fresh) {
      const bubble = lastAnswerBubble();
      const target = bubble ? bubble.querySelector(".reply") : null;
      const raw = target ? target.dataset.raw || "" : "";
      if (!target || fresh) {
        addBubble("Cursor", text, "answer");
      } else if (text.startsWith(raw)) {
        target.dataset.raw = text;
        paintMessage(target);
        bubble.classList.add("answer");
      } else if (!raw.startsWith(text)) {
        target.dataset.raw = raw + text;
        paintMessage(target);
        bubble.classList.add("answer");
      }
      followThreadBottom();
    }

    function addBubble(who, text, kind) {
      if (who === "你" || kind === "user") {
        addTurnMarker(text);
        setPrompt(text);
      }
      const reply = who === "Cursor";
      const bubble = document.createElement("article");
      bubble.className = "bubble" + (kind ? " " + kind : "");
      const name = document.createElement("span");
      name.className = "who";
      name.textContent = who;
      const body = document.createElement(reply ? "div" : "span");
      if (reply) {
        body.dataset.raw = text;
        paintMessage(body);
      } else {
        body.textContent = text;
      }
      bubble.append(name, body);
      thread.append(bubble);
      return body;
    }

    function renderSnapshot(data) {
      state.cwd = data.cwd || state.cwd;
      state.name = data.name || state.name || "";
      state.preview = data.preview || state.preview || "";
      meta.textContent = (data.cwd || "未设置工作目录") + " · " + sessionLabel(data) + (data.model ? " · " + data.model : "");
      state.remoteRunning = Boolean(data.running);
      const statusText = data.status === "running" || data.running ? "处理中" : data.status === "failed" ? "失败" : "空闲";
      setStatus(statusText, data.status === "failed" ? "fail" : data.status === "running" || data.running ? "run" : "ok");
      toolLine.textContent = data.tool ? "正在调用：" + data.tool : "当前没有工具调用";
      if (!state.running) state.steps = data.steps || [];
      renderToolButtons();
      if (!monitor.hidden) renderSteps();
      syncLine.textContent = data.terminalSync === "missing" ? "终端进度尚未同步" : (data.note || "");
      renderUsage(data.usage);
      const entries = data.entries && data.entries.length ? data.entries : (data.messages || []).map((message) => ({ type: message.role, text: message.text }));
      const viewKey = [
        data.status,
        data.tool || "",
        data.omitted || 0,
        ...entries.map((entry) => [entry.type, entry.id || "", entry.title || "", entry.text || "", entry.detail || "", entry.promptHead || "", entry.scroll || ""].join("\n")),
      ].join("\u0001");
      applyModeSelect(data.mode || "");
      restoreFailedPrompt(data);
      if (state.running || viewKey === state.viewKey) return;
      const savedTop = thread.scrollTop;
      const savedHeight = thread.scrollHeight;
      const previous = [...thread.childNodes];
      thread.replaceChildren();
      try {
      if (data.omitted) {
        const older = document.createElement("button");
        older.type = "button";
        older.className = "history-more";
        older.textContent = "加载更多历史记录";
        older.title = "继续往前加载，直到第一条";
        older.addEventListener("click", () => loadOlderHistory());
        thread.append(older);
      }
      let lastQuestion = "";
      for (let index = 0; index < entries.length; index += 1) {
        const entry = entries[index];
        if (entry.type === "tool" || entry.type === "step") addActivity(entry);
        else if (entry.type === "note") {
          const note = document.createElement("p");
          note.className = "note" + (entry.kind === "turn-end" || entry.kind === "turn-fail" ? " " + entry.kind : "");
          note.textContent = entry.text || "";
          thread.append(note);
        } else {
          const failed = entry.type === "error";
          const isUser = entry.type === "user";
          if (isUser) lastQuestion = entry.text || "";
          const isAnswer = entry.type === "assistant" && !entries.slice(index + 1).some((item) => (
            item.type === "assistant" || item.type === "tool" || item.type === "step" || item.type === "user"
          ));
          addBubble(
            failed ? "失败" : isUser ? "你" : "Cursor",
            entry.text || "",
            failed ? "fail" : isUser ? "user" : isAnswer ? "answer" : "",
          );
        }
      }
      syncInputHistory(entries);
      const pending = state.pendingQuestion.trim();
      if (pending) {
        const kept = entries.some((entry) => {
          if (entry.type !== "user") return false;
          const shown = String(entry.text || "").trim();
          const clipped = shown.replace(/\n…（已截断）$/, "");
          return shown === pending || shown.startsWith(pending) || (shown !== clipped && pending.startsWith(clipped));
        });
        if (kept) state.pendingQuestion = "";
        else {
          addBubble("你", state.pendingQuestion, "user");
          lastQuestion = state.pendingQuestion;
        }
      }
      setPrompt(lastQuestion);
      if (state.anchorHistory) {
        pinningThread = true;
        thread.scrollTop = savedTop + Math.max(0, thread.scrollHeight - savedHeight);
        pinningThread = false;
        state.anchorHistory = false;
      } else if (state.stickToBottom) followThreadBottom();
      else {
        pinningThread = true;
        thread.scrollTop = savedTop;
        pinningThread = false;
      }
      syncPromptFromScroll();
      if (data.pendingChoice) showChoice(data.pendingChoice);
      state.viewKey = viewKey;
      } catch (error) {
        thread.replaceChildren(...previous);
        state.viewKey = "";
      }
    }

    function stepKey(id) {
      return String(id || "").replace(/[\r\n\t]+/g, " ").trim();
    }

    function findActivity(step) {
      const key = stepKey(step && step.id);
      if (!key) return null;
      for (const node of thread.querySelectorAll(".activity")) {
        if (node.dataset.step === key) return node;
      }
      return null;
    }

    function addActivity(step) {
      const row = document.createElement("div");
      row.className = "activity " + (step.kind || "tool");
      const key = stepKey(step.id);
      if (key) row.dataset.step = key;
      const button = document.createElement("button");
      button.type = "button";
      button.className = "line";
      const flag = step.status === "running" ? "进行中" : step.status === "error" ? "失败" : "";
      button.textContent = [step.label || step.name || "步骤", step.title || "", step.stat || "", flag, formatDuration(step.durationMs)].filter(Boolean).join("  ·  ");
      const detail = document.createElement("div");
      detail.className = "detail";
      button.addEventListener("click", () => {
        row.classList.toggle("open");
        if (row.classList.contains("open")) renderStepView(detail, step);
      });
      row.append(button, detail);
      thread.append(row);
      return row;
    }

    function upsertActivity(step) {
      if (!step || step.kind === "thinking") return;
      const existing = findActivity(step);
      if (!existing) {
        addActivity(step);
        followThreadBottom();
        return;
      }
      existing.className = "activity " + (step.kind || "tool") + (existing.classList.contains("open") ? " open" : "");
      const button = existing.querySelector("button");
      const flag = step.status === "running" ? "进行中" : step.status === "error" ? "失败" : "";
      button.textContent = [step.label || step.name || "步骤", step.title || "", step.stat || "", flag, formatDuration(step.durationMs)].filter(Boolean).join("  ·  ");
      if (existing.classList.contains("open")) renderStepView(existing.querySelector(".detail"), step);
    }

    function choiceQuestions() {
      return state.choice && Array.isArray(state.choice.questions) ? state.choice.questions : [];
    }

    function choiceOptions(question) {
      return [...question.options, { id: OTHER, label: "Other" }];
    }

    function optionKey(index) {
      if (index < 9) return String(index + 1);
      const letter = index - 9;
      return letter < 26 ? String.fromCharCode(97 + letter) : "";
    }

    function selectedIds(question) {
      return state.choiceSelected[question.id] || [];
    }

    function questionAnswered(question) {
      const ids = selectedIds(question).filter((id) => id !== OTHER);
      const other = selectedIds(question).includes(OTHER);
      const text = String(state.choiceFreeform[question.id] || "").trim();
      return ids.length > 0 || (other && text.length > 0);
    }

    function showChoice(choice) {
      if (!choice || !choice.questions || !choice.questions.length) return;
      if (choice.id === state.dismissedChoiceId) return;
      if (state.choice && state.choice.id === choice.id) return;
      state.choice = choice;
      state.choiceQuestion = 0;
      state.choiceOption = 0;
      state.choiceSelected = {};
      state.choiceFreeform = {};
      renderChoices(true);
    }

    function dismissChoice() {
      if (state.choice) state.dismissedChoiceId = state.choice.id;
      state.choice = null;
      renderChoices();
    }

    function renderChoices(focusPanel) {
      const box = document.querySelector("#choices");
      const questions = choiceQuestions();
      if (!state.choice || !questions.length) {
        box.hidden = true;
        box.replaceChildren();
        return;
      }
      const questionIndex = Math.max(0, Math.min(questions.length - 1, state.choiceQuestion));
      state.choiceQuestion = questionIndex;
      const question = questions[questionIndex];
      const options = choiceOptions(question);
      state.choiceOption = Math.max(0, Math.min(options.length - 1, state.choiceOption));
      box.hidden = false;
      box.replaceChildren();
      const title = document.createElement("h2");
      title.textContent = state.choice.title || "需要你选择";
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = "第 " + (questionIndex + 1) + " 题，共 " + questions.length + " 题";
      const ask = document.createElement("div");
      ask.className = "ask";
      ask.textContent = (questionIndex + 1) + ". " + question.prompt + (question.allowMultiple ? "（可多选）" : "");
      box.append(title, meta, ask);
      options.forEach((option, index) => {
        const active = index === state.choiceOption;
        const picked = selectedIds(question).includes(option.id);
        const mark = (active ? "› " : "  ") + (picked ? "[x]" : "[ ]");
        const key = optionKey(index);
        if (option.id === OTHER) {
          const row = document.createElement("div");
          row.className = "other" + (active ? " active" : "");
          const label = document.createElement("button");
          label.type = "button";
          label.className = "option";
          label.textContent = mark + " Other";
          label.addEventListener("click", () => {
            state.choiceOption = index;
            selectHighlighted();
          });
          const input = document.createElement("input");
          input.id = "choice-other";
          input.value = state.choiceFreeform[question.id] || "";
          input.placeholder = "自己输入";
          input.addEventListener("input", () => {
            state.choiceFreeform[question.id] = input.value;
            const ids = selectedIds(question).filter((id) => id !== OTHER);
            state.choiceSelected[question.id] = question.allowMultiple ? [...ids, OTHER] : [OTHER];
          });
          row.append(label, input);
          box.append(row);
          return;
        }
        const button = document.createElement("button");
        button.type = "button";
        button.className = "option" + (active ? " active" : "");
        button.textContent = mark + (key ? " [" + key + "] " : " ") + option.label;
        button.addEventListener("click", () => {
          state.choiceOption = index;
          selectHighlighted();
        });
        box.append(button);
      });
      const hint = document.createElement("p");
      hint.className = "hint";
      hint.textContent = "↑/↓ 选项 · ←/→ 题目 · 空格选定 · 回车下一题或提交 · Esc 跳过。命令行这一轮会先跳过提问，选完后这里把结果发给下一轮。";
      box.append(hint);
      if (focusPanel && document.activeElement !== document.querySelector("#message")) box.focus();
    }

    function moveOption(delta) {
      const questions = choiceQuestions();
      if (!questions.length) return;
      const count = choiceOptions(questions[state.choiceQuestion]).length;
      state.choiceOption = (state.choiceOption + delta + count) % count;
      renderChoices();
    }

    function moveQuestion(delta) {
      const questions = choiceQuestions();
      if (!questions.length) return;
      state.choiceQuestion = Math.max(0, Math.min(questions.length - 1, state.choiceQuestion + delta));
      state.choiceOption = 0;
      renderChoices();
    }

    function selectHighlighted() {
      const questions = choiceQuestions();
      const question = questions[state.choiceQuestion];
      if (!question) return;
      const option = choiceOptions(question)[state.choiceOption];
      if (!option) return;
      const current = selectedIds(question);
      if (question.allowMultiple) {
        state.choiceSelected[question.id] = current.includes(option.id)
          ? current.filter((id) => id !== option.id)
          : [...current, option.id];
      } else {
        state.choiceSelected[question.id] = [option.id];
      }
      renderChoices(option.id === OTHER);
      if (option.id === OTHER) {
        const input = document.querySelector("#choice-other");
        if (input) input.focus();
      }
    }

    function choiceAnswer() {
      const lines = ["我的选择："];
      if (state.choice.title) lines.push(state.choice.title, "");
      choiceQuestions().forEach((question, index) => {
        const picked = selectedIds(question);
        const labels = question.options.filter((option) => picked.includes(option.id)).map((option) => option.label);
        if (picked.includes(OTHER)) {
          const text = String(state.choiceFreeform[question.id] || "").trim();
          if (text) labels.push(text);
        }
        lines.push((index + 1) + ". " + question.prompt);
        lines.push("选择：" + labels.join("、"));
      });
      return lines.join("\n");
    }

    function advanceChoice() {
      const questions = choiceQuestions();
      if (!questions.length) return;
      const question = questions[state.choiceQuestion];
      if (!questionAnswered(question)) {
        selectHighlighted();
        return;
      }
      const missing = questions.findIndex((item) => !questionAnswered(item));
      if (missing >= 0) {
        state.choiceQuestion = missing;
        state.choiceOption = 0;
        renderChoices(true);
        return;
      }
      const text = choiceAnswer();
      state.dismissedChoiceId = state.choice.id;
      state.choice = null;
      renderChoices();
      sendText(text);
    }

    function choiceKey(event) {
      if (!state.choice || event.altKey || event.ctrlKey || event.metaKey) return;
      if (event.target && event.target.id === "message") return;
      const typingOther = event.target && event.target.id === "choice-other";
      if (typingOther) {
        if (event.key === "Escape") {
          event.preventDefault();
          dismissChoice();
        } else if (event.key === "Enter") {
          event.preventDefault();
          advanceChoice();
        } else if (event.key === "Tab") {
          event.preventDefault();
          moveQuestion(event.shiftKey ? -1 : 1);
        }
        return;
      }
      const questions = choiceQuestions();
      const options = questions.length ? choiceOptions(questions[state.choiceQuestion]) : [];
      const byKey = options.findIndex((option, index) => option.id !== OTHER && optionKey(index) === event.key);
      if (byKey >= 0) {
        event.preventDefault();
        state.choiceOption = byKey;
        selectHighlighted();
        return;
      }
      if (event.key === "ArrowUp") {
        event.preventDefault();
        moveOption(-1);
      } else if (event.key === "ArrowDown") {
        event.preventDefault();
        moveOption(1);
      } else if (event.key === "ArrowLeft") {
        event.preventDefault();
        moveQuestion(-1);
      } else if (event.key === "ArrowRight") {
        event.preventDefault();
        moveQuestion(1);
      } else if (event.key === " ") {
        event.preventDefault();
        selectHighlighted();
      } else if (event.key === "Enter") {
        event.preventDefault();
        advanceChoice();
      } else if (event.key === "Escape") {
        event.preventDefault();
        dismissChoice();
      }
    }

    let seenChatIds = null;

    function followChat(chatId) {
      state.chatId = chatId;
      state.viewKey = "";
      state.pendingQuestion = "";
      state.inputHistory = [];
      state.historyCursor = -1;
      state.historyDraft = "";
      state.choice = null;
      state.dismissedChoiceId = "";
      renderChoices();
      renderQueue();
      state.steps = [];
      state.selectedStep = 0;
      state.running = false;
      state.stickToBottom = true;
      state.historyTurns = 30;
      state.anchorHistory = false;
      document.querySelector("#cancel").hidden = true;
      history.replaceState(null, "", "/?chat=" + chatId);
      refresh();
    }

    let pendingCreate = null;

    function setCreateNote(text, fail) {
      const note = document.querySelector("#create-note");
      note.textContent = text || "";
      note.style.color = fail ? "var(--fail)" : "";
    }

    function hideCreateChoice() {
      pendingCreate = null;
      const panel = document.querySelector("#create-choice");
      if (panel) panel.hidden = true;
    }

    function showCreateChoice(cwd, chats) {
      const list = Array.isArray(chats) ? chats.filter((item) => item && item.chatId) : [];
      if (!list.length) {
        hideCreateChoice();
        return;
      }
      pendingCreate = { cwd, chatId: list[0].chatId, chats: list };
      const panel = document.querySelector("#create-choice");
      const text = document.querySelector("#create-choice-text");
      const turns = list[0].usage && list[0].usage.turns ? list[0].usage.turns + " 轮" : "尚无对话";
      const extra = list.length > 1 ? "，另有 " + (list.length - 1) + " 条同目录会话" : "";
      text.textContent = "已有「" + sessionLabel(list[0]) + "」（" + turns + "）" + extra + "。用旧的还是新建？";
      panel.hidden = false;
    }

    async function pickCwd() {
      const box = document.querySelector("#new-cwd");
      const pick = document.querySelector("#pick-cwd");
      hideCreateChoice();
      pick.disabled = true;
      setCreateNote("正在打开文件夹选择…");
      try {
        const response = await fetch("/api/pick-folder", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ cwd: box.value.trim() || state.cwd || "" }),
        });
        const json = await response.json();
        if (json.cancelled) {
          setCreateNote("");
          return;
        }
        if (!response.ok || !json.ok) {
          setCreateNote(json.message || "没有选择文件夹。", true);
          return;
        }
        box.value = json.cwd || "";
        setCreateNote("");
      } catch (error) {
        setCreateNote(error.message || "无法打开文件夹选择。", true);
      } finally {
        pick.disabled = false;
      }
    }

    async function reuseExistingChat() {
      if (!pendingCreate || !pendingCreate.chatId) return;
      const box = document.querySelector("#new-cwd");
      const button = document.querySelector("#create-chat");
      const pick = document.querySelector("#pick-cwd");
      const reuse = document.querySelector("#reuse-chat");
      const force = document.querySelector("#force-new-chat");
      const cwd = pendingCreate.cwd;
      const chatId = pendingCreate.chatId;
      button.disabled = true;
      pick.disabled = true;
      reuse.disabled = true;
      force.disabled = true;
      setCreateNote("正在附着旧会话…");
      try {
        const response = await fetch("/api/attach", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ chatId, cwd }),
        });
        const json = await response.json();
        if (!response.ok || !json.ok) {
          setCreateNote(json.message || "附着失败。", true);
          return;
        }
        box.value = json.cwd || cwd;
        hideCreateChoice();
        setCreateNote("已继续 " + chatId.slice(0, 8));
        followChat(chatId);
        await loadState();
      } catch (error) {
        setCreateNote(error.message || "附着失败。", true);
      } finally {
        button.disabled = false;
        pick.disabled = false;
        reuse.disabled = false;
        force.disabled = false;
      }
    }

    async function createChatFromPage(forceNew) {
      const box = document.querySelector("#new-cwd");
      const button = document.querySelector("#create-chat");
      const pick = document.querySelector("#pick-cwd");
      const reuse = document.querySelector("#reuse-chat");
      const force = document.querySelector("#force-new-chat");
      const cwd = (pendingCreate && forceNew ? pendingCreate.cwd : box.value.trim());
      if (!cwd) {
        hideCreateChoice();
        setCreateNote("请先填写或浏览工作目录。", true);
        box.focus();
        return;
      }
      if (!forceNew) hideCreateChoice();
      button.disabled = true;
      pick.disabled = true;
      if (reuse) reuse.disabled = true;
      if (force) force.disabled = true;
      setCreateNote(forceNew ? "正在创建新会话…" : "正在检查目录…");
      try {
        const response = await fetch("/api/create", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ cwd, forceNew: Boolean(forceNew) }),
        });
        const json = await response.json();
        if (json.existing && json.chatId) {
          box.value = json.cwd || cwd;
          showCreateChoice(json.cwd || cwd, json.chats || [{ chatId: json.chatId, usage: {} }]);
          setCreateNote("");
          return;
        }
        if (!response.ok || !json.ok || !json.chatId) {
          setCreateNote(json.message || "创建失败。", true);
          return;
        }
        box.value = json.cwd || cwd;
        hideCreateChoice();
        setCreateNote("已开启 " + json.chatId.slice(0, 8));
        followChat(json.chatId);
        await loadState();
      } catch (error) {
        setCreateNote(error.message || "创建失败。", true);
      } finally {
        button.disabled = false;
        pick.disabled = false;
        if (reuse) reuse.disabled = false;
        if (force) force.disabled = false;
      }
    }

    function modeTip(mode) {
      if (mode === "agent") return "Agent：可以改文件、跑命令";
      if (mode === "plan") return "Plan：只分析并给出计划，不改文件";
      if (mode === "ask") return "Ask：只回答问题，不改文件";
      return "默认：不指定模式";
    }

    function applyModeSelect(mode) {
      const select = document.querySelector("#mode");
      if (!select || document.activeElement === select) return;
      const value = mode === "agent" || mode === "plan" || mode === "ask" ? mode : "";
      state.mode = value;
      select.value = value;
      select.title = modeTip(value);
    }

    function restoreComposer(text) {
      const box = document.querySelector("#message");
      const value = String(text || "");
      if (!box || !value.trim() || box.value.trim()) return;
      box.value = value;
    }

    function restoreFailedPrompt(data) {
      const text = data && data.pendingPrompt ? String(data.pendingPrompt) : "";
      if (!text || state.running || data.running) return;
      const key = state.chatId + "\n" + text;
      if (state.promptRestoreKey === key) return;
      state.promptRestoreKey = key;
      restoreComposer(text);
    }

    function applyModelSelect(modelId) {
      const select = document.querySelector("#model");
      if (!select || document.activeElement === select) return;
      const id = modelId || "";
      state.modelId = id;
      if ([...select.options].some((option) => option.value === id)) select.value = id;
    }

    function fillModelSelect(models) {
      const select = document.querySelector("#model");
      const current = state.modelId || "";
      const fallback = document.createElement("option");
      fallback.value = "";
      fallback.textContent = "默认";
      select.replaceChildren(fallback);
      for (const model of models || []) {
        if (!model || !model.id) continue;
        const option = document.createElement("option");
        option.value = model.id;
        const suffix = model.isDefault ? "（默认）" : "";
        option.textContent = (model.name || model.id) + suffix;
        select.append(option);
      }
      applyModelSelect(current);
    }

    async function loadModels() {
      const select = document.querySelector("#model");
      try {
        const response = await fetch("/api/models");
        const json = await response.json();
        if (!response.ok || !json.ok) throw new Error(json.message || "模型列表加载失败");
        fillModelSelect(json.models || []);
        select.title = "下一条消息使用这个模型";
      } catch (error) {
        select.title = error.message || "模型列表加载失败";
      }
    }

    async function saveModel(chatId, modelId) {
      if (!chatId) return;
      await fetch("/api/model", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ chatId, modelId }),
      });
    }

    async function saveMode(chatId, mode) {
      if (!chatId) return;
      await fetch("/api/model", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ chatId, mode }),
      });
    }

    function applyProxyState(proxy) {
      const value = String(proxy || "").trim();
      state.proxy = value;
      const btn = document.querySelector("#toggle-proxy");
      const input = document.querySelector("#proxy-url");
      if (btn) {
        const short = value.replace(/^https?:\/\//i, "");
        btn.textContent = value ? "代理：" + short : "代理：直连";
        btn.title = value ? "当前代理 " + value + "（点击修改）" : "设置 Cursor CLI 访问外网的 HTTP 代理";
      }
      if (input && document.activeElement !== input && document.querySelector("#proxy-box")?.hidden) {
        input.value = value;
      }
    }

    async function saveProxy() {
      const input = document.querySelector("#proxy-url");
      const note = document.querySelector("#proxy-note");
      if (!input) return;
      note.textContent = "保存中…";
      note.style.color = "";
      try {
        const response = await fetch("/api/proxy", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ proxy: input.value }),
        });
        const json = await response.json();
        if (!response.ok || !json.ok) {
          note.textContent = json.message || "保存失败";
          note.style.color = "var(--fail)";
          return;
        }
        applyProxyState(json.proxy || "");
        input.value = json.proxy || "";
        note.textContent = json.proxy ? "已启用，下一轮生效" : "已改为直连";
        note.style.color = "";
        loadModels();
      } catch (error) {
        note.textContent = error.message || "保存失败";
        note.style.color = "var(--fail)";
      }
    }

    async function loadState() {
      let response;
      try {
        response = await fetch("/api/state");
      } catch {
        return;
      }
      if (!response.ok) return;
      const json = await response.json().catch(() => null);
      if (!json) return;
      applyProxyState(json.proxy || "");
      const chats = json.chats || [];
      const current = chats.find((chat) => chat.chatId === state.chatId);
      if (current) {
        applyModelSelect(current.modelId || "");
        applyModeSelect(current.mode || "");
      }
      if (!state.chatId) {
        state.chatId = json.activeChatId || "";
        if (state.chatId) history.replaceState(null, "", "/?chat=" + state.chatId);
      } else if (seenChatIds && !state.running) {
        const arrived = chats.find((chat) => chat.chatId && !seenChatIds.has(chat.chatId));
        if (arrived && arrived.chatId !== state.chatId) followChat(arrived.chatId);
      }
      seenChatIds = new Set(chats.map((chat) => chat.chatId));
      state.remoteRunning = (json.runningChatIds || []).includes(state.chatId);
      if (state.running && !state.remoteRunning) {
        state.idleWhileLocal += 1;
        if (state.idleWhileLocal >= 3) {
          state.turnToken += 1;
          state.running = false;
        }
      } else {
        state.idleWhileLocal = 0;
      }
      const cancel = document.querySelector("#cancel");
      if (cancel) cancel.hidden = !(state.running || state.remoteRunning);
      try { renderSessionGroups(chats, json.runningChatIds || []); } catch { /* 列表失败也不要挡住发送 */ }
      if (!state.running && !state.remoteRunning) {
        if (state.handed[state.chatId]) state.handed[state.chatId] = [];
        drainQueue();
      } else {
        flushQueueToServer();
      }
    }

    function cwdKey(cwd) {
      return String(cwd || "（未设置目录）");
    }

    function shortCwd(cwd) {
      const text = String(cwd || "（未设置目录）");
      const parts = text.replace(/[\\/]+$/, "").split(/[\\/]/);
      if (parts.length <= 2) return text;
      return parts.slice(-2).join("\\");
    }

    function isGroupOpen(cwd, chats) {
      const key = cwdKey(cwd);
      if (Object.prototype.hasOwnProperty.call(state.groupOpen, key)) return state.groupOpen[key];
      return chats.some((chat) => chat.chatId === state.chatId);
    }

    function selectChat(chatId) {
      state.chatId = chatId;
      state.viewKey = "";
      state.pendingQuestion = "";
      state.inputHistory = [];
      state.historyCursor = -1;
      state.historyDraft = "";
      state.choice = null;
      state.dismissedChoiceId = "";
      renderChoices();
      renderQueue();
      state.steps = [];
      state.selectedStep = 0;
      state.running = false;
      state.stickToBottom = true;
      state.historyTurns = 30;
      state.anchorHistory = false;
      document.querySelector("#cancel").hidden = true;
      history.replaceState(null, "", "/?chat=" + chatId);
      refresh();
      loadState();
    }

    async function loadOlderHistory() {
      if (state.historyLoading) return;
      state.historyLoading = true;
      state.historyTurns += 30;
      state.anchorHistory = true;
      state.stickToBottom = false;
      state.viewKey = "";
      try {
        await refresh();
      } finally {
        state.historyLoading = false;
      }
    }

    async function detachChat(chatId) {
      if (!chatId) return;
      try {
        const response = await fetch("/api/detach", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ chatId }),
        });
        const json = await response.json();
        if (!response.ok || !json.ok) {
          setCreateNote(json.message || "无法移除。", true);
          return;
        }
        if (state.chatId === chatId) {
          state.chatId = json.activeChatId || "";
          state.viewKey = "";
          state.pendingQuestion = "";
          if (state.chatId) history.replaceState(null, "", "/?chat=" + state.chatId);
          else history.replaceState(null, "", "/");
        }
        await loadState();
        if (state.chatId) await refresh();
        else {
          meta.textContent = "等待附着到 Cursor CLI 会话";
          thread.replaceChildren();
          setPrompt("");
        }
      } catch (error) {
        setCreateNote(error.message || "无法移除。", true);
      }
    }

    function sessionLabel(chat) {
      if (!chat) return "无会话";
      const name = String(chat.name || "").trim();
