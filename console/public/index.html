      const preview = String(chat.preview || "").trim();
      return name || preview || (chat.chatId ? chat.chatId.slice(0, 8) : "无会话");
    }

    async function renameChat(chatId, name) {
      const response = await fetch("/api/rename", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ chatId, name }),
      });
      const json = await response.json();
      if (!response.ok || !json.ok) throw new Error(json.message || "改名失败。");
      if (state.chatId === chatId) {
        state.name = json.name || "";
        state.preview = json.preview || "";
      }
      return json;
    }

    function renderSessionGroups(chats, runningIds) {
      if (document.activeElement && document.activeElement.classList.contains("rename-input")) return;
      const groups = new Map();
      for (const chat of chats) {
        const key = cwdKey(chat.cwd);
        if (!groups.has(key)) groups.set(key, { cwd: chat.cwd || "（未设置目录）", chats: [] });
        groups.get(key).chats.push(chat);
      }
      sessions.replaceChildren();
      for (const group of groups.values()) {
        const open = isGroupOpen(group.cwd, group.chats);
        const busyCount = group.chats.filter((chat) => runningIds.includes(chat.chatId)).length;
        const item = document.createElement("li");
        const head = document.createElement("div");
        head.className = "group-head" + (open ? " open" : "") + (busyCount ? " busy" : "");
        const toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = "group-toggle";
        const mark = document.createElement("span");
        mark.className = "mark";
        mark.textContent = open ? "▼" : "▶";
        const pathLabel = document.createElement("span");
        pathLabel.className = "path";
        pathLabel.title = group.cwd;
        pathLabel.textContent = shortCwd(group.cwd);
        toggle.append(mark, pathLabel);
        toggle.addEventListener("click", () => {
          state.groupOpen[cwdKey(group.cwd)] = !open;
          renderSessionGroups(chats, runningIds);
        });
        const count = document.createElement("span");
        count.className = "count";
        count.textContent = busyCount ? group.chats.length + " · 忙" : String(group.chats.length);
        head.append(toggle, count);
        if (group.cwd && group.cwd !== "（未设置目录）") {
          const add = document.createElement("button");
          add.type = "button";
          add.className = "group-add";
          add.textContent = "+";
          add.title = "在这个目录新建会话";
          add.addEventListener("click", () => {
            state.groupOpen[cwdKey(group.cwd)] = true;
            document.querySelector("#new-cwd").value = group.cwd;
            hideCreateChoice();
            createChatFromPage(true);
          });
          head.append(add);
        }
        const body = document.createElement("ul");
        body.className = "group-body";
        body.hidden = !open;
        for (const chat of group.chats) {
          const row = document.createElement("li");
          row.className = "chat-row";
          const busy = runningIds.includes(chat.chatId);
          const openBtn = document.createElement("button");
          openBtn.type = "button";
          openBtn.className = "open" + (chat.chatId === state.chatId ? " active" : "") + (busy ? " busy" : "");
          const label = sessionLabel(chat);
          openBtn.textContent = (busy ? "处理中 · " : "") + label;
          openBtn.title = (chat.name ? chat.chatId + " · " : "") + (chat.cwd || "");
          openBtn.addEventListener("click", () => selectChat(chat.chatId));
          const rename = document.createElement("button");
          rename.type = "button";
          rename.className = "rename";
          rename.textContent = "R";
          rename.title = "会话重命名";
          rename.addEventListener("click", (event) => {
            event.stopPropagation();
            const input = document.createElement("input");
            input.className = "rename-input";
            input.value = chat.name || chat.preview || "";
            input.maxLength = 80;
            input.setAttribute("aria-label", "会话名称");
            const finish = async (save) => {
              input.removeEventListener("blur", onBlur);
              if (!save) {
                await loadState();
                return;
              }
              try {
                await renameChat(chat.chatId, input.value);
                await loadState();
                if (state.chatId === chat.chatId) await refresh();
              } catch (error) {
                setCreateNote(error.message || "改名失败。", true);
                await loadState();
              }
            };
            const onBlur = () => finish(true);
            input.addEventListener("keydown", (keyEvent) => {
              if (keyEvent.key === "Enter") {
                keyEvent.preventDefault();
                input.removeEventListener("blur", onBlur);
                finish(true);
              } else if (keyEvent.key === "Escape") {
                keyEvent.preventDefault();
                input.removeEventListener("blur", onBlur);
                finish(false);
              }
            });
            input.addEventListener("blur", onBlur);
            openBtn.replaceWith(input);
            input.focus();
            input.select();
          });
          const detach = document.createElement("button");
          detach.type = "button";
          detach.className = "detach";
          detach.textContent = "-";
          detach.title = "移除会话";
          detach.addEventListener("click", (event) => {
            event.stopPropagation();
            detachChat(chat.chatId);
          });
          row.append(openBtn, rename, detach);
          body.append(row);
        }
        item.append(head, body);
        sessions.append(item);
      }
    }

    async function refresh() {
      if (!state.chatId) return;
      try {
        const response = await fetch("/api/session/" + state.chatId + "?turns=" + (state.historyTurns || 30));
        if (!response.ok) return;
        renderSnapshot(await response.json());
      } catch {
        return;
      }
    }

    thread.addEventListener("scroll", () => {
      if (!pinningThread) state.stickToBottom = threadNearBottom();
      if (state.running) return;
      syncPromptFromScroll();
    });

    function syncInputHistory(entries) {
      const fromThread = [];
      for (const entry of entries || []) {
        if (entry.type !== "user") continue;
        const text = String(entry.text || "").trim();
        if (!text || fromThread[fromThread.length - 1] === text) continue;
        fromThread.push(text);
      }
      const extra = state.inputHistory.filter((text) => !fromThread.includes(text));
      state.inputHistory = [...fromThread, ...extra].slice(-80);
      if (state.historyCursor >= state.inputHistory.length) state.historyCursor = state.inputHistory.length - 1;
    }

    function showInputHistory(index, box) {
      state.historyCursor = index;
      const text = index < 0 ? state.historyDraft : (state.inputHistory[index] || "");
      box.value = text;
      const pos = text.length;
      box.setSelectionRange(pos, pos);
    }

    document.querySelector("#message").addEventListener("keydown", (event) => {
      if (event.altKey && !event.ctrlKey && !event.metaKey && !event.shiftKey && (event.key === "s" || event.key === "S")) {
        event.preventDefault();
        document.querySelector("#composer").requestSubmit();
        return;
      }
      if (event.key === "Escape" && state.running && !event.altKey && !event.ctrlKey && !event.metaKey && !event.shiftKey) {
        event.preventDefault();
        cancelTurn();
        return;
      }
      if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
      if (event.key !== "ArrowUp" && event.key !== "ArrowDown") return;
      const box = event.currentTarget;
      if (box.selectionStart !== box.selectionEnd) return;
      const before = box.value.slice(0, box.selectionStart);
      const after = box.value.slice(box.selectionEnd);
      if (event.key === "ArrowUp") {
        if (before.includes("\n") || !state.inputHistory.length) return;
        event.preventDefault();
        if (state.historyCursor < 0) {
          state.historyDraft = box.value;
          showInputHistory(state.inputHistory.length - 1, box);
        } else if (state.historyCursor > 0) {
          showInputHistory(state.historyCursor - 1, box);
        }
        return;
      }
      if (after.includes("\n") || state.historyCursor < 0) return;
      event.preventDefault();
      showInputHistory(state.historyCursor >= state.inputHistory.length - 1 ? -1 : state.historyCursor + 1, box);
    });

    document.addEventListener("keydown", choiceKey);

    function chatQueue() {
      if (!state.queues[state.chatId]) state.queues[state.chatId] = [];
      return state.queues[state.chatId];
    }

    function handedQueue() {
      if (!state.handed[state.chatId]) state.handed[state.chatId] = [];
      return state.handed[state.chatId];
    }

    function renderQueue() {
      const list = document.querySelector("#queue");
      const waiting = state.chatId && state.queues[state.chatId] ? state.queues[state.chatId] : [];
      const handed = state.chatId && state.handed[state.chatId] ? state.handed[state.chatId] : [];
      list.replaceChildren();
      list.hidden = waiting.length + handed.length === 0;
      handed.forEach((text) => {
        const item = document.createElement("li");
        const label = document.createElement("span");
        label.textContent = "已插入 · " + text.replace(/\s+/g, " ");
        item.append(label);
        list.append(item);
      });
      waiting.forEach((text, index) => {
        const item = document.createElement("li");
        const label = document.createElement("span");
        label.textContent = "等待 " + (index + 1) + " · " + text.replace(/\s+/g, " ");
        const insert = document.createElement("button");
        insert.type = "button";
        insert.textContent = "插入";
        insert.addEventListener("click", () => insertQueued(index));
        const remove = document.createElement("button");
        remove.type = "button";
        remove.textContent = "移除";
        remove.addEventListener("click", () => {
          chatQueue().splice(index, 1);
          renderQueue();
        });
        item.append(label, insert, remove);
        list.append(item);
      });
    }

    let queueLock = false;

    async function handoffWhileBusy(text) {
      const response = await fetch("/api/steer", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ chatId: state.chatId, text }),
      });
      if (!response.ok) {
        await response.json().catch(() => ({}));
        return false;
      }
      await response.json().catch(() => ({}));
      handedQueue().push(text);
      return true;
    }

    async function flushQueueToServer() {
      if (queueLock || !state.chatId || (!state.running && !state.remoteRunning)) return;
      queueLock = true;
      try {
        const queue = state.queues[state.chatId];
        while (queue && queue.length && (state.running || state.remoteRunning)) {
          const text = queue[0];
          if (!(await handoffWhileBusy(text))) break;
          if (queue[0] === text) queue.shift();
          renderQueue();
        }
      } finally {
        queueLock = false;
        if (!state.running && !state.remoteRunning) drainQueue();
      }
    }

    function rememberInput(text) {
      const sent = String(text || "").trim();
      if (sent && state.inputHistory[state.inputHistory.length - 1] !== sent) state.inputHistory.push(sent);
      if (state.inputHistory.length > 80) state.inputHistory.shift();
      state.historyCursor = -1;
      state.historyDraft = "";
    }

    function enqueue(text) {
      rememberInput(text);
      chatQueue().push(text);
      renderQueue();
    }

    async function insertQueued(index) {
      const queue = chatQueue();
      const text = queue[index];
      if (!text || !state.chatId) return;
      queue.splice(index, 1);
      if (state.running || state.remoteRunning) {
        queue.unshift(text);
        renderQueue();
        await flushQueueToServer();
        return;
      }
      renderQueue();
      sendText(text);
    }

    function drainQueue() {
      if (queueLock || state.running || state.remoteRunning || !state.chatId) return;
      const queue = state.queues[state.chatId];
      if (!queue || !queue.length) return;
      const next = queue.shift();
      renderQueue();
      sendText(next);
    }

    function undoPendingSend(text) {
      const bubbles = [...thread.querySelectorAll("article.bubble.user")];
      const last = bubbles[bubbles.length - 1];
      if (!last) return;
      const body = last.lastElementChild;
      if (!body || body.textContent.trim() !== text.trim()) return;
      const marker = last.previousElementSibling;
      if (marker && marker.classList.contains("turn-marker")) marker.remove();
      last.remove();
    }

    async function cancelTurn() {
      if (!state.chatId || (!state.running && !state.remoteRunning)) return;
      state.remoteRunning = false;
      await fetch("/api/cancel", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ chatId: state.chatId }),
      });
    }

    function normalizeJsonNewlines(raw) {
      let out = "";
      let inString = false;
      let escape = false;
      for (let i = 0; i < raw.length; i += 1) {
        const ch = raw[i];
        if (inString) {
          if (escape) {
            escape = false;
            out += ch;
            continue;
          }
          if (ch === "\\") {
            escape = true;
            out += ch;
            continue;
          }
          if (ch === "\"") {
            inString = false;
            out += ch;
            continue;
          }
          if (ch === "\r") {
            if (raw[i + 1] === "\n") i += 1;
            out += "\\n";
            continue;
          }
          if (ch === "\n") {
            out += "\\n";
            continue;
          }
          out += ch;
          continue;
        }
        if (ch === "\"") inString = true;
        out += ch;
      }
      return out;
    }

    function pullJsonValues(buffer) {
      const values = [];
      let valueStart = -1;
      let inString = false;
      let escape = false;
      let depth = 0;
      for (let i = 0; i < buffer.length; i += 1) {
        const ch = buffer[i];
        if (inString) {
          if (escape) escape = false;
          else if (ch === "\\") escape = true;
          else if (ch === "\"") inString = false;
          continue;
        }
        if (valueStart < 0) {
          if (ch === "{" || ch === "[") {
            valueStart = i;
            depth = 1;
          }
          continue;
        }
        if (ch === "\"") inString = true;
        else if (ch === "{" || ch === "[") depth += 1;
        else if (ch === "}" || ch === "]") {
          depth -= 1;
          if (depth === 0) {
            try {
              values.push(JSON.parse(normalizeJsonNewlines(buffer.slice(valueStart, i + 1))));
            } catch {
              // One bad event must not abort the rest of the turn.
            }
            valueStart = -1;
          }
        }
      }
      return { values, rest: valueStart < 0 ? "" : buffer.slice(valueStart) };
    }

    function failureText(message) {
      const text = String(message || "").trim();
      if (!text) return "这一轮失败";
      if (/Unterminated string in JSON|Unexpected end of JSON|Unexpected token|Bad control character in string literal/.test(text) && text.length < 240) {
        return "这一轮失败";
      }
      return text;
    }

    async function sendText(text) {
      if (!text || !state.chatId) return;
      if (state.running || state.remoteRunning) {
        enqueue(text);
        flushQueueToServer();
        return;
      }
      const token = ++state.turnToken;
      const sentChat = state.chatId;
      rememberInput(text);
      state.running = true;
      state.pendingQuestion = text;
      setStatus("处理中", "run");
      addBubble("你", text, "user");
      state.stickToBottom = true;
      followThreadBottom();
      try {
        const response = await fetch("/api/message", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            chatId: state.chatId,
            text,
            cwd: state.cwd,
            modelId: document.querySelector("#model").value,
            mode: document.querySelector("#mode").value,
          }),
        });
        if (response.status === 409) {
          state.remoteRunning = true;
          state.pendingQuestion = "";
          undoPendingSend(text);
          enqueue(text);
          setStatus("处理中", "run");
          return;
        }
        if (!response.ok) {
          const json = await response.json().catch(() => ({}));
          addBubble("失败", failureText(json.message || "发送失败"), "fail");
          setStatus("失败", "fail");
          restoreComposer(text);
          return;
        }
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        const applyEvent = (item) => {
          if (!item || state.chatId !== sentChat) return;
          if (item.type === "model" && item.model) meta.textContent = state.cwd + " · " + sessionLabel(state) + " · " + item.model;
          if (item.type === "thinking") toolLine.textContent = "思考中";
          if (item.type === "tool") toolLine.textContent = item.done ? "当前没有工具调用" : "正在调用：" + item.name;
          if (item.type === "step") {
            rememberStep(item.step);
            upsertActivity(item.step);
          }
          if (item.type === "steer" && item.text) {
            addBubble("你", item.text, "user");
            followThreadBottom();
          }
          if (item.type === "assistant" && item.text) absorbAssistant(item.text, item.fresh);
          if (item.type === "choice") showChoice(item.choice);
          if (item.type === "usage") renderUsage(item.usage);
          if (item.type === "done") {
            const stopped = item.cancelled === true;
            const failed = !stopped && item.ok === false;
            if (failed) {
              setStatus("失败", "fail");
              restoreComposer(text);
            } else setStatus("空闲", "ok");
            const note = document.createElement("p");
            note.className = "note " + (failed || stopped ? "turn-fail" : "turn-end");
            note.textContent = failed || stopped ? failNote(stopped, item.message) : "本轮已结束";
            thread.append(note);
            followThreadBottom();
          } else if (item.type === "error") {
            addBubble("失败", failureText(item.message), "fail");
            setStatus("失败", "fail");
            restoreComposer(text);
            followThreadBottom();
          }
        };
        while (true) {
          const chunk = await reader.read();
          if (chunk.done) break;
          buffer += decoder.decode(chunk.value, { stream: true });
          const pulled = pullJsonValues(buffer);
          buffer = pulled.rest;
          for (const item of pulled.values) applyEvent(item);
        }
        buffer += decoder.decode();
        const tail = pullJsonValues(buffer);
        for (const item of tail.values) applyEvent(item);
      } catch (error) {
        addBubble("失败", failureText(error.message), "fail");
        setStatus("失败", "fail");
        restoreComposer(text);
      } finally {
        if (token !== state.turnToken) return;
        if (state.chatId === sentChat) state.running = false;
        try { await refresh(); } catch { /* 刷新失败也要继续把队列发出去 */ }
        try { await loadState(); } catch { /* 状态失败也要继续把队列发出去 */ }
        if (token === state.turnToken && state.chatId === sentChat) drainQueue();
      }
    }

    document.querySelector("#composer").addEventListener("submit", (event) => {
      event.preventDefault();
      const box = document.querySelector("#message");
      const text = box.value.trim();
      if (!text || !state.chatId) return;
      box.value = "";
      sendText(text);
    });
    document.querySelector("#cancel").addEventListener("click", () => cancelTurn());
    document.querySelector("#pick-cwd").addEventListener("click", () => pickCwd());
    document.querySelector("#create-chat").addEventListener("click", () => createChatFromPage(false));
    document.querySelector("#reuse-chat").addEventListener("click", () => reuseExistingChat());
    document.querySelector("#force-new-chat").addEventListener("click", () => createChatFromPage(true));
    document.querySelector("#new-cwd").addEventListener("input", () => hideCreateChoice());
    document.querySelector("#new-cwd").addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.altKey && !event.ctrlKey && !event.metaKey) {
        event.preventDefault();
        createChatFromPage(false);
      }
    });

    document.querySelector("#model").addEventListener("change", (event) => {
      state.modelId = event.currentTarget.value;
      if (state.chatId) saveModel(state.chatId, state.modelId);
    });
    document.querySelector("#mode").addEventListener("change", (event) => {
      state.mode = event.currentTarget.value;
      event.currentTarget.title = modeTip(state.mode);
      if (state.chatId) saveMode(state.chatId, state.mode);
    });
    document.querySelector("#toggle-proxy").addEventListener("click", () => {
      const box = document.querySelector("#proxy-box");
      const input = document.querySelector("#proxy-url");
      const note = document.querySelector("#proxy-note");
      box.hidden = !box.hidden;
      if (!box.hidden) {
        input.value = state.proxy || "";
        note.textContent = "";
        input.focus();
        input.select();
      }
    });
    const ZOOM_MIN = 80;
    const ZOOM_MAX = 200;
    const ZOOM_STEP = 10;
    let threadZoom = Number(localStorage.getItem("webai-thread-zoom")) || 100;

    function applyThreadZoom(next) {
      threadZoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, Math.round(next / ZOOM_STEP) * ZOOM_STEP));
      const stick = state.stickToBottom;
      document.documentElement.style.setProperty("--thread-zoom", String(threadZoom / 100));
      localStorage.setItem("webai-thread-zoom", String(threadZoom));
      document.querySelector("#zoom-reset").textContent = threadZoom + "%";
      document.querySelector("#zoom-out").disabled = threadZoom <= ZOOM_MIN;
      document.querySelector("#zoom-in").disabled = threadZoom >= ZOOM_MAX;
      if (stick) followThreadBottom();
    }

    document.querySelector("#zoom-out").addEventListener("click", () => applyThreadZoom(threadZoom - ZOOM_STEP));
    document.querySelector("#zoom-in").addEventListener("click", () => applyThreadZoom(threadZoom + ZOOM_STEP));
    document.querySelector("#zoom-reset").addEventListener("click", () => applyThreadZoom(100));
    applyThreadZoom(threadZoom);
    document.querySelector("#save-proxy").addEventListener("click", () => saveProxy());
    document.querySelector("#proxy-url").addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        saveProxy();
      } else if (event.key === "Escape") {
        event.preventDefault();
        document.querySelector("#proxy-box").hidden = true;
      }
    });
    document.querySelector("#open-monitor").addEventListener("click", () => openMonitor());
    document.querySelector("#close-monitor").addEventListener("click", () => { monitor.hidden = true; });
    loadModels();
    loadState().then(refresh);
    setInterval(() => {
      loadState();
      if (!state.running) refresh();
    }, 2000);
  </script>
</body>
</html>
